services:
  db:
    image: postgres:17-alpine
    container_name: isupply-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: isupply
      POSTGRES_PASSWORD: isupply
      POSTGRES_DB: isupply
      # Deterministic collation so ORDER BY on part numbers is stable.
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    ports:
      # 5432 is taken by other stacks on this machine; expose on 5433.
      - "5433:5432"
    volumes:
      - isupply-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U isupply -d isupply"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
      secrets:
        # Build-time only. `docker build` has no access to the compose network,
        # so this URL reaches the seeded db through the host's published port.
        - database_url
        - auth_secret
    container_name: isupply-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://isupply:isupply@db:5432/isupply
      AUTH_SECRET_FILE: /run/secrets/auth_secret
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-changeme}
      USD_TO_RIAL: ${USD_TO_RIAL:-1100000}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL:-}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      SUPABASE_CATALOG_BUCKET: ${SUPABASE_CATALOG_BUCKET:-catalog-images}
      SUPABASE_IMPORT_BUCKET: ${SUPABASE_IMPORT_BUCKET:-catalog-imports}
      NODE_ENV: production
      # The one header the proxy below overwrites with the client address.
      TRUSTED_PROXY_HEADER: x-real-ip
    secrets:
      - auth_secret
    # No published port: every request comes through `proxy`, which is what
    # makes the client address trustworthy (deploy/nginx.conf).
    expose:
      - "3000"
    profiles:
      # Only starts with `--profile full`. Day-to-day you run the app on the
      # host against the dockerised db, which is far faster to iterate on.
      - full

  proxy:
    image: nginx:1.27-alpine
    container_name: isupply-proxy
    restart: unless-stopped
    depends_on:
      - app
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    profiles:
      - full

volumes:
  isupply-pgdata:

secrets:
  # Values come from the host environment (or Compose's `.env` interpolation
  # environment), are never copied into the build context, and are granted only
  # to the app/build stages that name them above.
  database_url:
    environment: DOCKER_BUILD_DATABASE_URL
  auth_secret:
    environment: AUTH_SECRET
