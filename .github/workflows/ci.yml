name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: postgres://isupply:isupply@127.0.0.1:5432/isupply
      DIRECT_DATABASE_URL: postgres://isupply:isupply@127.0.0.1:5432/isupply
      AUTH_SECRET: ci-only-auth-secret-at-least-32-characters
      ADMIN_PASSWORD: ci-admin-password
      E2E_ADMIN_PASSWORD: ci-admin-password
      # next start is a production server; tell it which header holds the
      # client address (src/lib/rateLimit.ts). Next fills this one locally.
      TRUSTED_PROXY_HEADER: x-forwarded-for
      # Invoices refuse the stand-in contact details (review L-6); the fresh
      # CI database has none saved, so these are what it prints.
      SELLER_EMAIL: sales@ci.example.org
      SELLER_PHONE: "+98 21 1111 2222"
      USD_TO_TOMAN: "110000"
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: isupply
          POSTGRES_PASSWORD: isupply
          POSTGRES_DB: isupply
          POSTGRES_INITDB_ARGS: --locale=C --encoding=UTF8
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U isupply -d isupply"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps --only-shell chromium

      - name: Build isolated database
        run: npm run db:bootstrap:local

      - name: Static and unit checks
        run: |
          npm run lint
          npm run typecheck
          npm test
          npm run audit:prod

      - name: Database checks
        run: |
          npm run test:db
          npm run db:verify

      - name: Production build
        run: npm run build

      - name: Browser and accessibility checks
        run: npm run test:e2e

      - name: Upload browser diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
