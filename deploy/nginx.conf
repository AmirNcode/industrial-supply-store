# The self-hosted front door. The app trusts exactly one header for the
# client's address (TRUSTED_PROXY_HEADER=x-real-ip, src/lib/rateLimit.ts), so
# this proxy must overwrite it on every request — and overwrite or drop the
# other forwarding headers, so nothing a client sends survives to the app.
# Without this, every rate limit (the shared admin password's included) could
# be bypassed with a made-up header (review finding H-5).
#
# TLS is not terminated here yet: put the certificate on this server block (or
# on a load balancer in front of it) before the site takes real traffic.

server {
  listen 80;
  client_max_body_size 30m;

  location / {
    proxy_pass http://app:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Vercel-Forwarded-For "";
    proxy_read_timeout 90s;
  }
}
